name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          unzip -oq OneTapFiles_v3.zip -d tmp
          rm -rf tmp/OneTapFiles/.github
          cp -a tmp/OneTapFiles/. .
          rm -rf tmp OneTapFiles_v3.zip
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Unzip files"
          git push
