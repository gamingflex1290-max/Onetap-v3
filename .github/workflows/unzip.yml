name: Unzip
on: workflow_dispatch
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          for z in *.zip; do unzip -oq "$z" -d tmp; rm -f "$z"; done
          rm -rf tmp/OneTapFiles/.github
          cp -a tmp/OneTapFiles/. .
          rm -rf tmp
      - run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Unzip files"
          git push
